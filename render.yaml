# Render: API + frontend. Postgres = Vultr (DATABASE_URL on storytrace-api).
# Blueprint → Manual sync after paste DATABASE_URL when prompted.

services:
  - type: web
    name: storytrace-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://storytrace-web.onrender.com

  - type: web
    name: storytrace-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://storytrace-api.onrender.com
      - key: SPEECHMATICS_KEY
        sync: false
