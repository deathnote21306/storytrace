# Render Blueprint — deploy backend + frontend + Postgres from GitHub
# Dashboard: https://dashboard.render.com → New → Blueprint → connect repo
#
# After deploy:
#   1. Copy the API URL (e.g. https://storytrace-api.onrender.com)
#   2. Set NEXT_PUBLIC_API_URL on the frontend service to that URL (no trailing slash)
#   3. Set CORS_ORIGINS on the API to your frontend URL (e.g. https://storytrace-web.onrender.com)
#   4. Submit the FRONTEND URL for the hackathon demo

databases:
  - name: storytrace-db
    databaseName: storytrace
    user: storytrace
    plan: free

services:
  - type: web
    name: storytrace-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: storytrace-db
          property: connectionString
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: storytrace-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: SPEECHMATICS_KEY
        sync: false
