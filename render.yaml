# Render Blueprint — https://dashboard.render.com → Blueprint → Ahmadjajja/storytrace
# After changing this file: Blueprint → Manual sync
#
# Hackathon demo URL: https://storytrace-web.onrender.com

databases:
  - name: storytrace-db
    databaseName: storytrace
    user: storytrace
    plan: free

services:
  - type: web
    name: storytrace-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: storytrace-db
          property: connectionString
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://storytrace-web.onrender.com

  - type: web
    name: storytrace-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://storytrace-api.onrender.com
      - key: SPEECHMATICS_KEY
        sync: false
